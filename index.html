<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Annadata Agri & Seeds Launch</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  overflow:hidden;
  font-family:Arial, sans-serif;
  background:#07180d;
  color:white;
}

.scene{
  position:relative;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    linear-gradient(rgba(5,25,10,.35),rgba(5,25,10,.75)),
    radial-gradient(circle at 50% 20%,rgba(255,207,79,.18),transparent 28%),
    linear-gradient(135deg,#082414,#12351d,#07180d);
}

/* cinematic moving light */
.scene::before{
  content:"";
  position:absolute;
  inset:-30%;
  background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.14),transparent 55%);
  transform:translateX(-70%) rotate(8deg);
  animation:lightSweep 15s ease forwards;
}

/* field */
.field{
  position:absolute;
  bottom:0;
  width:100%;
  height:34%;
  background:
    linear-gradient(to top,#0d3d1f,#1f7a3a 55%,transparent);
  clip-path:polygon(0 48%,12% 38%,26% 52%,40% 35%,58% 50%,74% 36%,100% 48%,100% 100%,0 100%);
  opacity:.95;
}

/* sun */
.sun{
  position:absolute;
  top:10%;
  right:12%;
  width:150px;
  height:150px;
  border-radius:50%;
  background:linear-gradient(#ffd86b,#f2b705);
  box-shadow:0 0 70px rgba(242,183,5,.45);
  opacity:.85;
}

/* particles */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  border-radius:50%;
  background:#f4d35e;
  opacity:.65;
  animation:floatUp 15s linear infinite;
}

/* countdown */
.countdown-screen{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,rgba(255,215,100,.12),transparent 35%),
    rgba(3,18,8,.96);
}

.count-wrap{
  position:relative;
  width:330px;
  height:330px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:3px solid rgba(244,211,94,.25);
  animation:ringPulse 1s ease-in-out infinite;
}

.ring::before{
  content:"";
  position:absolute;
  inset:18px;
  border-radius:50%;
  border:2px dashed rgba(34,197,94,.45);
  animation:spin 5s linear infinite;
}

.number{
  font-size:135px;
  font-weight:900;
  color:#fff7d6;
  text-shadow:0 8px 30px rgba(0,0,0,.6);
  animation:numberPop 1s ease infinite;
}

.count-text{
  position:absolute;
  bottom:38px;
  font-size:15px;
  letter-spacing:5px;
  color:#f4d35e;
  font-weight:bold;
}

/* launch content */
.content{
  position:relative;
  z-index:5;
  max-width:1100px;
  padding:20px;
  opacity:0;
  transform:translateY(35px) scale(.96);
}

.show-content{
  animation:contentIn 1.4s ease forwards;
}

.badge{
  display:inline-block;
  padding:12px 28px;
  border-radius:50px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(244,211,94,.45);
  color:#f9eaa2;
  letter-spacing:4px;
  font-size:14px;
  font-weight:bold;
  backdrop-filter:blur(12px);
}

.logo{
  margin-top:28px;
  font-size:82px;
  line-height:1.04;
  font-weight:900;
  letter-spacing:2px;
  color:#ffffff;
  text-shadow:0 6px 28px rgba(0,0,0,.65);
}

.logo span{
  color:#f4d35e;
}

.hindi{
  margin-top:18px;
  font-size:32px;
  font-weight:800;
  color:#dff7e7;
  text-shadow:0 5px 18px rgba(0,0,0,.5);
}

.line{
  width:0;
  height:4px;
  margin:28px auto;
  border-radius:40px;
  background:linear-gradient(90deg,transparent,#f4d35e,#22c55e,#f4d35e,transparent);
  animation:lineGrow 1.8s ease forwards;
  animation-delay:1.3s;
}

.owner-card{
  margin:0 auto;
  margin-top:12px;
  max-width:520px;
  padding:18px 26px;
  border-radius:22px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(16px);
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.owner-label{
  font-size:13px;
  letter-spacing:4px;
  color:#b7f7c8;
  font-weight:bold;
}

.owner-name{
  margin-top:8px;
  font-size:42px;
  font-weight:900;
  color:#f4d35e;
  letter-spacing:2px;
  text-shadow:0 4px 18px rgba(0,0,0,.45);
}

.services{
  margin-top:26px;
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  justify-content:center;
}

.services div{
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.16);
  font-weight:bold;
  color:#fff;
}

.live{
  margin-top:34px;
  font-size:32px;
  font-weight:900;
  letter-spacing:4px;
  color:#b7f7c8;
  text-shadow:0 4px 18px rgba(0,0,0,.45);
  animation:softPulse 2s infinite;
}

.by{
  margin-top:14px;
  font-size:18px;
  letter-spacing:5px;
  color:#f4d35e;
  font-weight:bold;
}

.flash{
  position:absolute;
  inset:0;
  background:white;
  opacity:0;
  z-index:30;
  pointer-events:none;
}

.flash-now{
  animation:flash .55s ease forwards;
}

@keyframes numberPop{
  0%{transform:scale(.6);opacity:0}
  35%{transform:scale(1.08);opacity:1}
  100%{transform:scale(1.25);opacity:0}
}

@keyframes ringPulse{
  0%{transform:scale(.82);opacity:.35}
  55%{transform:scale(1);opacity:1}
  100%{transform:scale(1.16);opacity:0}
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes contentIn{
  to{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes lineGrow{
  to{width:560px}
}

@keyframes softPulse{
  0%,100%{transform:scale(1);opacity:.9}
  50%{transform:scale(1.04);opacity:1}
}

@keyframes flash{
  0%{opacity:0}
  35%{opacity:.75}
  100%{opacity:0}
}

@keyframes lightSweep{
  0%{transform:translateX(-80%) rotate(8deg)}
  100%{transform:translateX(80%) rotate(8deg)}
}

@keyframes floatUp{
  from{transform:translateY(110vh);opacity:0}
  20%{opacity:.75}
  to{transform:translateY(-15vh);opacity:0}
}

@media(max-width:768px){
  .count-wrap{width:240px;height:240px}
  .number{font-size:92px}
  .logo{font-size:42px}
  .hindi{font-size:22px}
  .owner-name{font-size:30px}
  .live{font-size:22px}
  .line{max-width:310px}
}
</style>
</head>

<body>

<div class="scene">

  <div class="sun"></div>
  <div class="field"></div>

  <div class="particle" style="left:8%;animation-delay:0s"></div>
  <div class="particle" style="left:18%;animation-delay:2s"></div>
  <div class="particle" style="left:31%;animation-delay:4s"></div>
  <div class="particle" style="left:45%;animation-delay:1s"></div>
  <div class="particle" style="left:59%;animation-delay:3s"></div>
  <div class="particle" style="left:72%;animation-delay:5s"></div>
  <div class="particle" style="left:86%;animation-delay:2.5s"></div>
  <div class="particle" style="left:94%;animation-delay:4.5s"></div>

  <div id="countdownScreen" class="countdown-screen">
    <div class="count-wrap">
      <div class="ring"></div>
      <div id="countNumber" class="number">5</div>
      <div class="count-text">LAUNCHING</div>
    </div>
  </div>

  <div id="flash" class="flash"></div>

  <div id="content" class="content">
    <div class="badge">OFFICIAL WEBSITE LAUNCH</div>

    <div class="logo">
      ANNADATA <span>AGRI</span><br>
      & SEEDS
    </div>

    <div class="hindi">किसानों के भरोसे की नई डिजिटल शुरुआत</div>

    <div class="line"></div>

    <div class="owner-card">
      <div class="owner-label">FOUNDER & OWNER</div>
      <div class="owner-name">KESHAV MEENA</div>
    </div>

    <div class="services">
      <div>🌾 Quality Seeds</div>
      <div>🌱 Crop Guidance</div>
      <div>🛒 Agri Products</div>
      <div>📍 Salamatpur</div>
    </div>

    <div class="live">WEBSITE IS LIVE</div>
    <div class="by">BY PRIYAMX MEDIA</div>
  </div>

</div>

<script>
const countdownScreen = document.getElementById("countdownScreen");
const countNumber = document.getElementById("countNumber");
const content = document.getElementById("content");
const flash = document.getElementById("flash");

let count = 5;

const timer = setInterval(() => {
  count--;

  if(count > 0){
    countNumber.textContent = count;
    countNumber.style.animation = "none";
    void countNumber.offsetWidth;
    countNumber.style.animation = "numberPop 1s ease infinite";
  } else {
    countNumber.textContent = "GO";
    countNumber.style.fontSize = "95px";

    setTimeout(() => {
      flash.classList.add("flash-now");
      countdownScreen.style.transition = "opacity .7s ease";
      countdownScreen.style.opacity = "0";

      setTimeout(() => {
        countdownScreen.style.display = "none";
        content.classList.add("show-content");
      }, 650);

    }, 700);

    clearInterval(timer);
  }
}, 1000);
</script>

</body>
</html>
