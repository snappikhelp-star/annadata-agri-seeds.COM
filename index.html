<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Annadata Agri & Seeds Launch</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  height:100vh;
  overflow:hidden;
  background:#06150b;
  font-family:Arial, sans-serif;
  color:white;
}

.scene{
  position:relative;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(135deg,#06150b,#12351d,#07180d);
}

.scene:before{
  content:"";
  position:absolute;
  inset:-40%;
  background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.10),transparent 55%);
  animation:sweep 14s ease forwards;
}

.sky{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 70% 18%,rgba(244,211,94,.24),transparent 22%),
    radial-gradient(circle at 20% 20%,rgba(34,197,94,.16),transparent 24%);
}

.sun{
  position:absolute;
  top:10%;
  right:12%;
  width:170px;
  height:170px;
  border-radius:50%;
  background:linear-gradient(#ffe39a,#e5a900);
  box-shadow:0 0 80px rgba(244,211,94,.45);
  animation:sun 4s infinite;
}

.field{
  position:absolute;
  bottom:0;
  width:100%;
  height:36%;
  background:linear-gradient(to top,#0d3d1f,#207a39 55%,transparent);
  clip-path:polygon(0 48%,12% 38%,26% 52%,40% 35%,58% 50%,74% 36%,100% 48%,100% 100%,0 100%);
}

.horizon{
  position:absolute;
  bottom:26%;
  width:100%;
  height:120px;
  background:linear-gradient(to top,rgba(6,21,11,.8),transparent);
}

.crop{
  position:absolute;
  bottom:-30px;
  font-size:42px;
  opacity:.85;
  animation:sway 3s ease-in-out infinite;
}

.countdown-screen{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,rgba(244,211,94,.16),transparent 35%),rgba(3,18,8,.98);
}

.count-wrap{
  position:relative;
  width:320px;
  height:320px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.ring{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:3px solid rgba(244,211,94,.28);
  animation:ring 1s infinite;
}

.ring:before{
  content:"";
  position:absolute;
  inset:22px;
  border-radius:50%;
  border:2px dashed rgba(34,197,94,.45);
  animation:spin 4s linear infinite;
}

.ring:after{
  content:"";
  position:absolute;
  inset:48px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.18);
}

.number{
  font-size:120px;
  font-weight:900;
  color:#fff7d6;
  text-shadow:0 10px 30px rgba(0,0,0,.7);
  animation:pop 1s infinite;
}

.count-text{
  position:absolute;
  bottom:40px;
  font-size:15px;
  letter-spacing:6px;
  color:#f4d35e;
  font-weight:800;
}

.content{
  position:relative;
  z-index:10;
  width:100%;
  max-width:1180px;
  padding:25px;
  opacity:0;
}

.show{
  opacity:1;
}

.ganesh,
.badge,
.logo,
.hindi,
.owner-card,
.services,
.live,
.final-msg,
.by{
  opacity:0;
  transform:translateY(35px);
}

.ganesh{
  font-size:28px;
  font-weight:900;
  color:#ffffff;
  margin-bottom:18px;
  letter-spacing:2px;
  text-shadow:0 0 16px rgba(255,255,255,.28);
}

.badge{
  display:inline-block;
  padding:12px 30px;
  border-radius:50px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(244,211,94,.45);
  color:#f9eaa2;
  letter-spacing:4px;
  font-size:14px;
  font-weight:800;
  backdrop-filter:blur(14px);
}

.logo{
  margin-top:24px;
  font-size:78px;
  line-height:1.04;
  font-weight:900;
  letter-spacing:2px;
  color:#fff;
  text-shadow:0 8px 30px rgba(0,0,0,.7);
}

.logo span{
  color:#f4d35e;
}

.hindi{
  margin-top:16px;
  font-size:32px;
  font-weight:800;
  color:#dff7e7;
}

.line{
  width:0;
  height:4px;
  margin:22px auto;
  border-radius:40px;
  background:linear-gradient(90deg,transparent,#f4d35e,#22c55e,#f4d35e,transparent);
}

.owner-card{
  margin:0 auto;
  margin-top:12px;
  max-width:560px;
  padding:18px 28px;
  border-radius:24px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(16px);
  box-shadow:0 22px 70px rgba(0,0,0,.3);
}

.owner-label{
  font-size:13px;
  letter-spacing:4px;
  color:#b7f7c8;
  font-weight:800;
}

.owner-name{
  margin-top:8px;
  font-size:40px;
  font-weight:900;
  color:#f4d35e;
  letter-spacing:2px;
  text-shadow:0 5px 18px rgba(0,0,0,.45);
}

.services{
  margin-top:24px;
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  justify-content:center;
}

.services div{
  padding:13px 20px;
  border-radius:16px;
  background:rgba(255,255,255,.11);
  border:1px solid rgba(255,255,255,.16);
  font-weight:800;
}

.live{
  margin-top:28px;
  font-size:34px;
  font-weight:900;
  letter-spacing:5px;
  color:#b7f7c8;
}

.visit{
  margin-top:14px;
  font-size:18px;
  letter-spacing:4px;
  color:#fff7d6;
  font-weight:900;
}

.domain{
  margin-top:8px;
  font-size:34px;
  font-weight:900;
  color:#f4d35e;
  letter-spacing:2px;
  text-shadow:0 5px 22px rgba(244,211,94,.45);
  animation:domainPulse 2s infinite;
}

.by{
  margin-top:14px;
  font-size:18px;
  letter-spacing:5px;
  color:#f4d35e;
  font-weight:800;
}

.final-msg{
  margin-top:16px;
  font-size:21px;
  color:#fff7d6;
  font-weight:800;
}

.show .ganesh{animation:in .5s ease forwards .1s}
.show .badge{animation:in .5s ease forwards .3s}
.show .logo{animation:in .6s ease forwards .6s}
.show .hindi{animation:in .6s ease forwards 1s}
.show .line{animation:line .8s ease forwards 1.2s}
.show .owner-card{animation:in .6s ease forwards 1.6s}
.show .services{animation:in .6s ease forwards 2.1s}
.show .live{animation:in .6s ease forwards 2.6s, pulse 2s infinite 3.2s}
.show .final-msg{animation:in .6s ease forwards 3.1s}
.show .by{animation:in .6s ease forwards 3.6s}

@keyframes in{
  to{opacity:1;transform:translateY(0)}
}

@keyframes line{
  to{width:600px}
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}

@keyframes domainPulse{
  0%,100%{transform:scale(1);text-shadow:0 5px 22px rgba(244,211,94,.45)}
  50%{transform:scale(1.04);text-shadow:0 8px 34px rgba(244,211,94,.75)}
}

@keyframes pop{
  0%{transform:scale(.6);opacity:0}
  35%{transform:scale(1.08);opacity:1}
  100%{transform:scale(1.25);opacity:0}
}

@keyframes ring{
  0%{transform:scale(.82);opacity:.35}
  55%{transform:scale(1);opacity:1}
  100%{transform:scale(1.16);opacity:0}
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes sway{
  0%,100%{transform:rotate(-4deg)}
  50%{transform:rotate(4deg)}
}

@keyframes sun{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.07)}
}

@keyframes sweep{
  0%{transform:translateX(-80%) rotate(8deg)}
  100%{transform:translateX(80%) rotate(8deg)}
}

@media(max-width:768px){
  .count-wrap{
    width:240px;
    height:240px;
  }

  .number{
    font-size:90px;
  }

  .ganesh{
    font-size:18px;
    margin-bottom:12px;
  }

  .badge{
    font-size:11px;
    letter-spacing:2px;
    padding:10px 18px;
  }

  .logo{
    font-size:41px;
  }

  .hindi{
    font-size:21px;
  }

  .owner-card{
    padding:16px 18px;
  }

  .owner-name{
    font-size:30px;
  }

  .live{
    font-size:23px;
    letter-spacing:3px;
  }

  .domain{
    font-size:21px;
    letter-spacing:1px;
  }

  .line{
    max-width:320px;
  }

  .services div{
    font-size:14px;
    padding:11px 14px;
  }

  .by{
    font-size:14px;
    letter-spacing:3px;
  }
}
</style>
</head>

<body>
<div class="scene">
  <div class="sky"></div>
  <div class="sun"></div>
  <div class="horizon"></div>
  <div class="field"></div>

  <div class="crop" style="left:6%">🌾</div>
  <div class="crop" style="left:18%;animation-delay:.5s">🌱</div>
  <div class="crop" style="left:32%;animation-delay:1s">🌾</div>
  <div class="crop" style="left:48%;animation-delay:.2s">🌱</div>
  <div class="crop" style="left:64%;animation-delay:.8s">🌾</div>
  <div class="crop" style="left:80%;animation-delay:1.2s">🌱</div>
  <div class="crop" style="left:93%;animation-delay:.4s">🌾</div>

  <div id="countdownScreen" class="countdown-screen">
    <div class="count-wrap">
      <div class="ring"></div>
      <div id="countNumber" class="number">3</div>
      <div class="count-text">LAUNCHING</div>
    </div>
  </div>

  <div id="content" class="content">
    <div class="ganesh">॥ श्री गणेशाय नमः ॥</div>

    <div class="badge">OFFICIAL WEBSITE LAUNCH</div>

    <div class="logo">ANNADATA <span>AGRI</span><br>& SEEDS</div>

    <div class="hindi">किसानों के भरोसे की नई डिजिटल शुरुआत</div>

    <div class="line"></div>

    <div class="owner-card">
      <div class="owner-label">FOUNDER & OWNER</div>
      <div class="owner-name">KESHAV MEENA</div>
    </div>

    <div class="services">
      <div>🌾 Quality Seeds</div>
      <div>🌱 Crop Guidance</div>
      <div>🛒 Agri Products</div>
      <div>📍 Salamatpur</div>
    </div>

    <div class="live">WEBSITE IS LIVE</div>

    <div class="final-msg">
      <div class="visit">🌐 VISIT NOW</div>
      <div class="domain">ANNADATAAGRIANDSEEDS.COM</div>
    </div>

    <div class="by">BY PRIYAMX MEDIA</div>
  </div>
</div>

<script>
const countdownScreen = document.getElementById("countdownScreen");
const countNumber = document.getElementById("countNumber");
const content = document.getElementById("content");

let count = 3;

const timer = setInterval(() => {
  count--;

  if (count > 0) {
    countNumber.textContent = count;
    countNumber.style.animation = "none";
    void countNumber.offsetWidth;
    countNumber.style.animation = "pop 1s infinite";
  } else {
    countNumber.textContent = "GO";
    countNumber.style.fontSize = "90px";

    setTimeout(() => {
      countdownScreen.style.transition = "opacity .5s ease";
      countdownScreen.style.opacity = "0";

      setTimeout(() => {
        countdownScreen.style.display = "none";
        content.classList.add("show");
      }, 500);
    }, 300);

    clearInterval(timer);
  }
}, 1000);
</script>
</body>
</html>
